<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Cloud Storage</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#0f172a;color:#e5e7eb}
.container{max-width:1080px;margin:0 auto;padding:24px}
h1{margin-top:0;color:#facc15}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;margin-bottom:16px}
input,button,select{padding:9px 11px;border-radius:8px;border:1px solid #374151;background:#020617;color:#e5e7eb;margin:4px}
button{cursor:pointer;background:#1d4ed8;border-color:#2563eb;color:#fff}
button:hover{background:#2563eb}
button.gray{background:#374151;border-color:#4b5563}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #1f2937;padding:9px;text-align:left;vertical-align:middle}
#status{margin-top:12px;padding:11px;border-radius:8px;background:#020617;border:1px solid #1f2937;min-height:20px;white-space:pre-wrap}
.small{color:#94a3b8;font-size:13px}
.crumbs span{color:#facc15;cursor:pointer;margin-right:6px}
.crumbs span.last{color:#e5e7eb;cursor:default}
.sharebox{margin-top:10px;padding:10px;border:1px dashed #374151;border-radius:8px;display:none;word-break:break-all}
.folderlink{color:#60a5fa;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="container">
<h1>Banana Cloud Storage</h1>

<div class="card">
<h2>Авторизация</h2>
<input id="email" type="email" placeholder="email" value="test@example.com">
<input id="password" type="password" placeholder="password" value="secret123">
<button onclick="registerUser()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h2>Мои файлы</h2>
<div class="crumbs" id="crumbs"></div>
<div>
<button onclick="createFolder()">Новая папка</button>
<input id="file" type="file">
<button onclick="uploadFile()">Загрузить сюда</button>
<button class="gray" onclick="loadCurrent()">Обновить</button>
</div>
<table>
<thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Actions</th></tr></thead>
<tbody id="items"></tbody>
</table>
<div class="sharebox" id="sharebox"></div>
<div id="movebox" style="display:none;margin-top:10px">
Куда переместить: <select id="moveSelect"></select>
<button onclick="confirmMove()">Переместить</button>
<button class="gray" onclick="hideMove()">Отмена</button>
</div>
</div>

<div class="card">
<h2>Публичный доступ (проверка share-ссылки)</h2>
<input id="shareInput" type="text" placeholder="вставь ссылку или токен" size="60">
<button onclick="openShare()">Открыть</button>
<div class="small">Работает БЕЗ входа — так ссылку видит посторонний человек.</div>
<div id="shareView"></div>
</div>

<div id="status">Готово.</div>
</div>

<script>
var token = localStorage.getItem('banana_token') || '';
var chain = [{id:'', name:'Корень'}];
var moveFileID = '';

function cur(){ return chain[chain.length-1].id; }
function setStatus(m){ document.getElementById('status').textContent = m; }
function setToken(v){ token=v||''; if(token) localStorage.setItem('banana_token',token); else localStorage.removeItem('banana_token'); }
function getCredentials(){ return {email:document.getElementById('email').value.trim(), password:document.getElementById('password').value}; }
function h(tag,text){ var e=document.createElement(tag); e.textContent=text; return e; }

async function api(path,opts){
	opts=opts||{};opts.headers=opts.headers||{};
	if(token)opts.headers['Authorization']='Bearer '+token;
	if(opts.body&&!(opts.body instanceof FormData))opts.headers['Content-Type']='application/json';
	var r=await fetch(path,opts),d=null;
	try{d=await r.json()}catch(e){}
	if(!r.ok){
		if(r.status===401&&token){ setToken(''); setStatus('Сессия истекла (сервер перезапускался). Нажми Login.'); }
		var msg='HTTP '+r.status; if(d&&d.error&&d.error.message)msg=d.error.message; throw new Error(msg);
	}
	return d;
}

async function registerUser(){
	try{ await api('/api/v1/auth/register',{method:'POST',body:JSON.stringify(getCredentials())}); setStatus('Пользователь создан. Вхожу...'); await login(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function login(){
	try{ var d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify(getCredentials())}); setToken(d.token); setStatus('Вход выполнен.'); chain=[{id:'',name:'Корень'}]; loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function logout(){
	try{ await api('/api/v1/auth/logout',{method:'POST'}); }catch(e){}
	setToken(''); renderItems([],[]); renderCrumbs(); setStatus('Выход выполнен.');
}

function renderCrumbs(){
	var el=document.getElementById('crumbs'); el.innerHTML='';
	chain.forEach(function(c,i){
		var s=document.createElement('span');
		var isLast=(i===chain.length-1);
		s.textContent=c.name+(isLast?'':' /');
		if(isLast){ s.className='last'; }
		else{ s.onclick=function(){ chain=chain.slice(0,i+1); loadCurrent(); }; }
		el.appendChild(s);
	});
}

async function loadCurrent(){
	renderCrumbs();
	var tb=document.getElementById('items');
	if(!token){ tb.innerHTML=''; setStatus('Войди, чтобы видеть файлы.'); return; }
	try{
		var fRes=await api('/api/v1/files?folderID='+encodeURIComponent(cur()));
		var dRes=await api('/api/v1/folders?parentID='+encodeURIComponent(cur()));
		renderItems(dRes.items||[], fRes.items||[]);
		setStatus('Папка "'+cur_name()+'": папок '+(dRes.items||[]).length+', файлов '+(fRes.items||[]).length);
	}catch(e){ setStatus('Ошибка: '+e.message); }
}
function cur_name(){ return chain[chain.length-1].name; }

function renderItems(folders,files){
	var tb=document.getElementById('items'); tb.innerHTML='';
	if(!folders.length&&!files.length){
		var tr0=document.createElement('tr'),td0=document.createElement('td');
		td0.colSpan=4; td0.textContent='Пусто. Создай папку или загрузи файл.';
		tr0.appendChild(td0); tb.appendChild(tr0); return;
	}
	folders.forEach(function(d){
		var tr=document.createElement('tr');
		var n=document.createElement('td');
		var link=document.createElement('span'); link.className='folderlink'; link.textContent='📁 '+d.name;
		link.onclick=function(){ openFolder(d); };
		n.appendChild(link);
		var t=document.createElement('td'); t.textContent='folder';
		var s=document.createElement('td'); s.textContent='—';
		var a=document.createElement('td');
		a.appendChild(mkBtn('Открыть',function(){openFolder(d)}));
		a.appendChild(mkBtn('Переим.',function(){renameFolder(d.id)}));
		a.appendChild(mkBtn('Share',function(){shareResource('folder',d.id)}));
		a.appendChild(mkBtn('Удалить',function(){deleteFolder(d.id)}));
		tr.appendChild(n);tr.appendChild(t);tr.appendChild(s);tr.appendChild(a);tb.appendChild(tr);
	});
	files.forEach(function(f){
		var tr=document.createElement('tr');
		var n=document.createElement('td'); n.textContent=f.name;
		var t=document.createElement('td'); t.textContent=f.contentType;
		var s=document.createElement('td'); s.textContent=f.size;
		var a=document.createElement('td');
		a.appendChild(mkBtn('Download',function(){downloadFile(f.id,f.name)}));
		a.appendChild(mkBtn('Share',function(){shareResource('file',f.id)}));
		a.appendChild(mkBtn('Move',function(){startMove(f.id)}));
		a.appendChild(mkBtn('Удалить',function(){deleteFile(f.id)}));
		tr.appendChild(n);tr.appendChild(t);tr.appendChild(s);tr.appendChild(a);tb.appendChild(tr);
	});
}
function mkBtn(text,fn){ var b=document.createElement('button'); b.textContent=text; b.onclick=fn; return b; }
function openFolder(d){ chain.push({id:d.id,name:d.name}); loadCurrent(); }

async function createFolder(){
	if(!token){ setStatus('Войди.'); return; }
	var name=prompt('Имя папки:'); if(!name) return;
	try{ await api('/api/v1/folders',{method:'POST',body:JSON.stringify({name:name,parentID:cur()})}); setStatus('Папка создана.'); loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function renameFolder(id){
	var name=prompt('Новое имя папки:'); if(!name) return;
	try{ await api('/api/v1/folders/'+id,{method:'PATCH',body:JSON.stringify({name:name})}); loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function deleteFolder(id){
	if(!confirm('Удалить папку ВМЕСТЕ со всем содержимым?')) return;
	try{ await api('/api/v1/folders/'+id,{method:'DELETE'}); setStatus('Папка удалена.'); loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}

async function uploadFile(){
	if(!token){ setStatus('Войди.'); return; }
	var fi=document.getElementById('file');
	if(!fi.files||!fi.files[0]){ setStatus('Выбери файл.'); return; }
	var fd=new FormData(); fd.append('file',fi.files[0]);
	try{ await api('/api/v1/files?folderID='+encodeURIComponent(cur()),{method:'POST',body:fd}); fi.value=''; setStatus('Файл загружен в "'+cur_name()+'".'); loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function deleteFile(id){
	if(!confirm('Удалить файл?')) return;
	try{ await api('/api/v1/files/'+encodeURIComponent(id),{method:'DELETE'}); setStatus('Файл удалён.'); loadCurrent(); }
	catch(e){ setStatus('Ошибка: '+e.message); }
}
async function downloadFile(id,name){
	try{
		var r=await fetch('/api/v1/files/'+encodeURIComponent(id)+'/download',{headers:{'Authorization':'Bearer '+token}});
		if(!r.ok) throw new Error('HTTP '+r.status);
		var b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');
		a.href=u; a.download=name||'download'; document.body.appendChild(a); a.click(); a.remove();
		setTimeout(function(){URL.revokeObjectURL(u)},1000);
		setStatus('Скачивание началось.');
	}catch(e){ setStatus('Ошибка: '+e.message); }
}

async function startMove(id){
	moveFileID=id;
	var sel=document.getElementById('moveSelect'); sel.innerHTML='';
	var o=document.createElement('option'); o.value=''; o.textContent='Корень'; sel.appendChild(o);
	try{
		await addFolderOptions(sel,'',0);
		document.getElementById('movebox').style.display='block';
	}catch(e){ setStatus('Ошибка: '+e.message); }
}
async function addFolderOptions(sel,parentID,depth){
	var d=await api('/api/v1/folders?parentID='+encodeURIComponent(parentID));
	var items=d.items||[];
	for(var i=0;i<items.length;i++){
		var f=items[i];
		var o=document.createElement('option'); o.value=f.id; o.textContent='- '.repeat(depth)+f.name;
		sel.appendChild(o);
		if(depth<4) await addFolderOptions(sel,f.id,depth+1);
	}
}
async function confirmMove(){
	try{
		var sel=document.getElementById('moveSelect');
		await api('/api/v1/files/'+moveFileID+'/move',{method:'PATCH',body:JSON.stringify({folderID:sel.value})});
		hideMove(); setStatus('Файл перемещён.'); loadCurrent();
	}catch(e){ setStatus('Ошибка: '+e.message); }
}
function hideMove(){ document.getElementById('movebox').style.display='none'; }

async function shareResource(type,id){
	try{
		var d=await api('/api/v1/share',{method:'POST',body:JSON.stringify({resourceType:type,resourceID:id})});
		var full=location.origin+d.url;
		var box=document.getElementById('sharebox');
		box.style.display='block'; box.innerHTML='';
		box.appendChild(h('div','Ссылка на '+type+':'));
		var a=document.createElement('a'); a.href=full; a.target='_blank'; a.textContent=full; box.appendChild(a);
		box.appendChild(document.createElement('br'));
		var b=mkBtn('Копировать',function(){
			navigator.clipboard.writeText(full).then(function(){setStatus('Ссылка скопирована.')},function(){setStatus('Скопируй вручную: '+full)});
		});
		box.appendChild(b);
		box.appendChild(h('div','Скопируй её и вставь в блок "Публичный доступ" ниже (или открой в приватном окне).'));
		setStatus('Share-ссылка создана.');
	}catch(e){ setStatus('Ошибка: '+e.message); }
}

function extractToken(v){
	v=v.trim();
	var marker='/api/v1/share/';
	var i=v.indexOf(marker);
	if(i>=0){ return v.slice(i+marker.length).split('/')[0]; }
	return v;
}
async function openShare(){
	var t=extractToken(document.getElementById('shareInput').value);
	if(!t){ setStatus('Вставь ссылку или токен.'); return; }
	var view=document.getElementById('shareView'); view.innerHTML='';
	try{
		var r=await fetch('/api/v1/share/'+encodeURIComponent(t));
		if(!r.ok) throw new Error('HTTP '+r.status);
		var d=await r.json();
		if(d.resourceType==='file'){
			view.appendChild(h('p','Файл: '+d.file.name+' ('+d.file.size+' байт)'));
			var b=document.createElement('button'); b.textContent='Скачать без входа';
			b.onclick=function(){ location.href='/api/v1/share/'+t+'/download'; };
			view.appendChild(b);
		}else{
			view.appendChild(h('p','Папка: '+d.folder.name));
			(d.items.files||[]).forEach(function(f){
				var row=document.createElement('div');
				row.textContent=f.name+' ('+f.size+' байт) ';
				var bb=document.createElement('button'); bb.textContent='Download';
				bb.onclick=function(){ location.href='/api/v1/share/'+t+'/download?fileID='+f.id; };
				row.appendChild(bb); view.appendChild(row);
			});
			(d.items.folders||[]).forEach(function(s){
				view.appendChild(h('div','📁 '+s.name+' (вложенная папка, по ссылке не открывается)'));
			});
		}
		setStatus('Share-ссылка открыта (без входа).');
	}catch(e){ setStatus('Ошибка открытия ссылки: '+e.message); }
}

window.onload=function(){ renderCrumbs(); if(token) loadCurrent(); };
</script>
</body>
</html>
