<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Cloud Storage</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-2: #161a22;
    --bg-3: #1d222d;
    --border: #2a3140;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --primary: #ffd23f;
    --primary-2: #f5b800;
    --danger: #ef4444;
    --success: #22c55e;
    --debug-height: 220px; /* начальная высота debug-панели */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden; /* чтобы скролл был только внутри main */
  }
  button, input, select { font-family: inherit; font-size: 14px; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ===== Auth ===== */
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  .logo { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .logo span { color: var(--primary); }
  .auth-sub { color: var(--muted); margin-bottom: 24px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg-3); padding: 4px; border-radius: 10px; }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer;
    color: var(--muted); font-weight: 500; transition: .15s;
  }
  .tab.active { background: var(--bg-2); color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .field input {
    width: 100%; padding: 11px 14px; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); outline: none;
  }
  .field input:focus { border-color: var(--primary); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; font-weight: 500; background: var(--bg-3); color: var(--text);
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--primary); color: #1a1a1a; }
  .btn-primary:hover { background: var(--primary-2); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-block { width: 100%; }

  .err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* ===== App ===== */
  .app { display: none; height: 100vh; flex-direction: column; }
  .app.visible { display: flex; }
  header.topbar {
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  header .logo { margin: 0; font-size: 20px; }
  header .spacer { flex: 1; }
  .user-chip { color: var(--muted); font-size: 13px; }

  .toolbar {
    padding: 16px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .breadcrumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .crumb { color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .crumb:hover { background: var(--bg-3); color: var(--text); }
  .crumb.current { color: var(--text); cursor: default; }
  .crumb.current:hover { background: transparent; }
  .crumb-sep { color: var(--border); }

  /* ★ Скроллируемая область файлов ★ */
  main.content {
    flex: 1;
    padding: 24px;
    overflow-y: auto;   /* вертикальный скролл */
    overflow-x: auto;   /* горизонтальный скролл для широких таблиц */
    min-height: 0;      /* важно для flex-контейнера */
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  th {
    color: var(--muted); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px;
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  tr:hover td { background: var(--bg-2); }
  .row-folder td:first-child, .row-file td:first-child { cursor: pointer; }
  .row-folder td:first-child:hover, .row-file td:first-child:hover { color: var(--primary); }
  .icon { margin-right: 8px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  .actions-cell { display: flex; gap: 6px; }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; width: 100%; max-width: 440px;
  }
  .modal h3 { margin: 0 0 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px;
    z-index: 200; opacity: 0; transform: translateY(10px); transition: .2s;
    max-width: 360px;
  }
  .toast.visible { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); }
  .toast.success { border-color: var(--success); }

  /* ===== Debug Panel (закрываемая + resizable) ===== */
  .debug-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--debug-height);
    background: #0a0c0f;
    border-top: 2px solid var(--primary);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: height 0s; /* чтобы resize был плавным без transition */
  }
  .debug-panel.hidden {
    display: none;
  }
  .debug-header {
    padding: 8px 12px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    cursor: ns-resize; /* курсор показывает, что можно тянуть */
    user-select: none;
  }
  .debug-header h4 { margin: 0; color: var(--primary); font-size: 13px; }
  .debug-header-actions { display: flex; gap: 6px; align-items: center; }
  .debug-content {
    padding: 8px;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 11px;
    flex: 1;
    min-height: 0;
  }
  .debug-log {
    padding: 4px 8px;
    margin: 2px 0;
    border-left: 3px solid var(--border);
    background: var(--bg-2);
    word-break: break-word;
  }
  .debug-log.request { border-left-color: #3b82f6; }
  .debug-log.response { border-left-color: var(--success); }
  .debug-log.error { border-left-color: var(--danger); }
  .debug-log.info { border-left-color: var(--primary); }
  .debug-time { color: var(--muted); margin-right: 8px; }
  .debug-method { color: #3b82f6; font-weight: bold; margin-right: 8px; }
  .debug-status { margin-right: 8px; }
  .debug-status.ok { color: var(--success); }
  .debug-status.err { color: var(--danger); }

  /* Ручка для изменения размера */
  .debug-resize-handle {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    cursor: ns-resize;
    background: transparent;
  }
  .debug-resize-handle:hover,
  .debug-resize-handle.active {
    background: var(--primary);
    opacity: 0.3;
  }

  /* Кнопка открытия debug-панели (когда она закрыта) */
  .debug-toggle-btn {
    position: fixed;
    bottom: 16px; right: 16px;
    z-index: 999;
    background: var(--primary);
    color: #1a1a1a;
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    display: none;
  }
  .debug-toggle-btn.visible { display: flex; align-items: center; justify-content: center; }
  .debug-toggle-btn:hover { background: var(--primary-2); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="logo">🍌 Banana <span>Cloud</span></div>
    <div class="auth-sub">Приватное облачное хранилище</div>
    <div class="tabs">
      <div class="tab active" data-tab="login">Вход</div>
      <div class="tab" data-tab="register">Регистрация</div>
    </div>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" required minlength="6" autocomplete="current-password" />
      </div>
      <div class="err" id="login-err"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <form id="register-form" class="hidden">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Пароль (мин. 6 символов)</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="err" id="register-err"></div>
      <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-screen" class="app">
  <header class="topbar">
    <div class="logo">🍌 Banana <span>Cloud</span></div>
    <div class="spacer"></div>
    <div class="user-chip" id="user-email"></div>
    <button class="btn btn-sm" id="logout-btn">Выйти</button>
  </header>

  <div class="toolbar">
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div style="flex:1"></div>
    <button class="btn btn-sm" id="new-folder-btn">📁 Новая папка</button>
    <button class="btn btn-sm btn-primary" id="upload-btn">⬆️ Загрузить</button>
    <input type="file" id="file-input" multiple class="hidden" />
  </div>

  <main class="content">
    <table>
      <thead>
        <tr>
          <th>Имя</th>
          <th>Тип</th>
          <th>Размер</th>
          <th>Создано</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <div id="empty-state" class="empty hidden">Папка пуста</div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ DEBUG PANEL ============ -->
<button class="debug-toggle-btn" id="debug-toggle-btn" title="Открыть логи">🔍</button>

<div class="debug-panel" id="debug-panel">
  <div class="debug-resize-handle" id="debug-resize-handle"></div>
  <div class="debug-header" id="debug-header">
    <h4>🔍 Debug Log</h4>
    <div class="debug-header-actions">
      <button class="btn btn-sm" id="debug-clear-btn" title="Очистить">🗑 Очистить</button>
      <button class="btn btn-sm btn-danger" id="debug-close-btn" title="Закрыть">✕ Закрыть</button>
    </div>
  </div>
  <div class="debug-content" id="debug-content"></div>
</div>

<script>
// ===================== DEBUG PANEL: resize + close + persist =====================
const debugPanel = document.getElementById('debug-panel');
const debugToggleBtn = document.getElementById('debug-toggle-btn');
const debugCloseBtn = document.getElementById('debug-close-btn');
const debugClearBtn = document.getElementById('debug-clear-btn');
const debugResizeHandle = document.getElementById('debug-resize-handle');
const debugHeader = document.getElementById('debug-header');

// Загрузка сохранённого состояния
const savedDebugState = JSON.parse(localStorage.getItem('debug_state') || '{}');
if (savedDebugState.hidden) {
  debugPanel.classList.add('hidden');
  debugToggleBtn.classList.add('visible');
}
if (savedDebugState.height) {
  document.documentElement.style.setProperty('--debug-height', savedDebugState.height + 'px');
}

function saveDebugState() {
  const h = debugPanel.offsetHeight;
  localStorage.setItem('debug_state', JSON.stringify({
    hidden: debugPanel.classList.contains('hidden'),
    height: h
  }));
}

debugCloseBtn.addEventListener('click', () => {
  debugPanel.classList.add('hidden');
  debugToggleBtn.classList.add('visible');
  saveDebugState();
});

debugToggleBtn.addEventListener('click', () => {
  debugPanel.classList.remove('hidden');
  debugToggleBtn.classList.remove('visible');
  saveDebugState();
});

debugClearBtn.addEventListener('click', () => {
  document.getElementById('debug-content').innerHTML = '';
});

// ★ Resize через перетаскивание заголовка ★
let isResizing = false;
let startY = 0;
let startHeight = 0;

function startResize(e) {
  isResizing = true;
  startY = e.clientY || (e.touches && e.touches[0].clientY);
  startHeight = debugPanel.offsetHeight;
  debugResizeHandle.classList.add('active');
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
}

function doResize(e) {
  if (!isResizing) return;
  const y = e.clientY || (e.touches && e.touches[0].clientY);
  const delta = startY - y; // тянем вверх → увеличиваем
  const newHeight = Math.max(80, Math.min(startHeight + delta, window.innerHeight - 100));
  document.documentElement.style.setProperty('--debug-height', newHeight + 'px');
}

function stopResize() {
  if (!isResizing) return;
  isResizing = false;
  debugResizeHandle.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  saveDebugState();
}

debugHeader.addEventListener('mousedown', startResize);
debugResizeHandle.addEventListener('mousedown', startResize);
document.addEventListener('mousemove', doResize);
document.addEventListener('mouseup', stopResize);

// Touch-поддержка
debugHeader.addEventListener('touchstart', startResize, { passive: false });
debugResizeHandle.addEventListener('touchstart', startResize, { passive: false });
document.addEventListener('touchmove', doResize, { passive: false });
document.addEventListener('touchend', stopResize);

// ===================== DEBUG LOGGING =====================
function debugLog(type, message, data = null) {
  const time = new Date().toLocaleTimeString('ru-RU', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const entry = document.createElement('div');
  entry.className = `debug-log ${type}`;

  let html = `<span class="debug-time">[${time}]</span>`;

  if (type === 'request') {
    const [method, url] = message.split(' ');
    html += `<span class="debug-method">${method}</span><span>${url}</span>`;
  } else if (type === 'response') {
    const [status, url] = message.split(' ');
    const statusClass = status.startsWith('2') ? 'ok' : 'err';
    html += `<span class="debug-status ${statusClass}">${status}</span><span>${url}</span>`;
  } else {
    html += `<span>${message}</span>`;
  }

  if (data !== null && data !== undefined) {
    const preview = JSON.stringify(data);
    const short = preview.length > 300 ? preview.substring(0, 300) + '…' : preview;
    html += `<div style="margin-top:4px;color:var(--muted);font-size:10px;white-space:pre-wrap;">${short.replace(/</g,'&lt;')}</div>`;
  }

  entry.innerHTML = html;
  const content = document.getElementById('debug-content');
  content.appendChild(entry);
  content.scrollTop = content.scrollHeight;

  console.log(`[${type.toUpperCase()}]`, message, data || '');
}

// ===================== STATE =====================
const state = {
  token: localStorage.getItem('banana_token'),
  email: localStorage.getItem('banana_email'),
  currentFolderId: '',
  folderPath: [],
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

// ===================== API =====================
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  let bodyToSend = opts.body;
  if (!(opts.body instanceof FormData) && opts.body && typeof opts.body === 'object') {
    headers['Content-Type'] = 'application/json';
    bodyToSend = JSON.stringify(opts.body);
  }

  const method = opts.method || 'GET';
  debugLog('request', `${method} ${path}`, opts.body);

  try {
    const res = await fetch(path, { ...opts, headers, body: bodyToSend });
    const text = await res.text();

    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    debugLog('response', `${res.status} ${path}`, data);

    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);
      debugLog('error', `API Error: ${msg}`, data);
      throw new Error(msg);
    }

    return data;
  } catch (err) {
    debugLog('error', `Fetch failed: ${err.message}`, { path, opts });
    throw err;
  }
}

// ===================== TOAST =====================
let toastTimer;
function toast(msg, type = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast visible ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), 3000);
}

// ===================== AUTH =====================
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  $('#login-form').classList.toggle('hidden', tab !== 'login');
  $('#register-form').classList.toggle('hidden', tab !== 'register');
}));

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email').toString().trim();
  const password = fd.get('password').toString();
  $('#login-err').textContent = '';

  try {
    debugLog('info', 'Attempting login', { email });
    const data = await api('/api/v1/auth/login', {
      method: 'POST',
      body: { email, password }
    });

    debugLog('info', 'Login successful', { token: data.token?.substring(0, 20) + '...' });

    state.token = data.token;
    state.email = email;
    localStorage.setItem('banana_token', data.token);
    localStorage.setItem('banana_email', email);
    showApp();
  } catch (err) {
    $('#login-err').textContent = err.message;
  }
});

$('#register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email').toString().trim();
  const password = fd.get('password').toString();
  $('#register-err').textContent = '';

  try {
    debugLog('info', 'Attempting registration', { email });
    await api('/api/v1/auth/register', {
      method: 'POST',
      body: { email, password }
    });

    toast('Аккаунт создан. Войдите.', 'success');
    $('.tab[data-tab="login"]').click();
    $('#login-form [name="email"]').value = email;
    $('#login-form [name="password"]').focus();
  } catch (err) {
    $('#register-err').textContent = err.message;
  }
});

$('#logout-btn').addEventListener('click', async () => {
  try { await api('/api/v1/auth/logout', { method: 'POST' }); } catch {}
  state.token = null; state.email = null;
  localStorage.removeItem('banana_token');
  localStorage.removeItem('banana_email');
  showAuth();
});

// ===================== APP =====================
function showAuth() {
  $('#auth-screen').style.display = 'flex';
  $('#app-screen').classList.remove('visible');
}

function showApp() {
  $('#auth-screen').style.display = 'none';
  $('#app-screen').classList.add('visible');
  $('#user-email').textContent = state.email || '';
  state.currentFolderId = '';
  state.folderPath = [];
  loadFolder();
}

// ===================== FOLDER NAV =====================
async function loadFolder() {
  debugLog('info', 'Loading folder', { folderId: state.currentFolderId || 'root' });

  const tbody = $('#items-body');
  tbody.innerHTML = '<tr><td colspan="5" class="empty">Загрузка...</td></tr>';
  $('#empty-state').classList.add('hidden');
  renderBreadcrumbs();

  try {
    const url = `/api/v1/folders/${encodeURIComponent(state.currentFolderId || 'root')}/items`;
    const data = await api(url);

    debugLog('info', 'Folder loaded', {
      folders: data.folders?.length || 0,
      files: data.files?.length || 0
    });

    renderItems(data.folders || [], data.files || []);
  } catch (err) {
    debugLog('error', 'Failed to load folder', { error: err.message });
    tbody.innerHTML = `<tr><td colspan="5" class="empty">Ошибка: ${err.message}</td></tr>`;
  }
}

function renderBreadcrumbs() {
  const bc = $('#breadcrumbs');
  bc.innerHTML = '';
  const root = document.createElement('span');
  root.className = 'crumb' + (state.folderPath.length === 0 ? ' current' : '');
  root.textContent = '🏠 Мои файлы';
  root.onclick = () => { state.currentFolderId = ''; state.folderPath = []; loadFolder(); };
  bc.appendChild(root);

  state.folderPath.forEach((p, i) => {
    const sep = document.createElement('span');
    sep.className = 'crumb-sep'; sep.textContent = '›';
    bc.appendChild(sep);
    const c = document.createElement('span');
    c.className = 'crumb' + (i === state.folderPath.length - 1 ? ' current' : '');
    c.textContent = p.name;
    c.onclick = () => {
      state.folderPath = state.folderPath.slice(0, i + 1);
      state.currentFolderId = p.id;
      loadFolder();
    };
    bc.appendChild(c);
  });
}

function renderItems(folders, files) {
  const tbody = $('#items-body');
  tbody.innerHTML = '';

  if (!folders.length && !files.length) {
    $('#empty-state').classList.remove('hidden');
    return;
  }
  $('#empty-state').classList.add('hidden');

folders.forEach(f => {
  const tr = document.createElement('tr');
  tr.className = 'row-folder';
  tr.innerHTML = `
    <td><span class="icon">📁</span>${escapeHtml(f.name)}</td>
    <td>Папка</td>
    <td>${fmtSize(f.size || 0)} (${f.fileCount || 0} файлов)</td>
    <td>${fmtDate(f.createdAt)}</td>
    <td class="actions-cell">
      <button class="btn btn-sm" data-act="rename-folder" data-id="${f.id}" data-name="${escapeAttr(f.name)}">✏️</button>
      <button class="btn btn-sm btn-danger" data-act="delete-folder" data-id="${f.id}">🗑</button>
    </td>`;
  tr.querySelector('td').onclick = () => openFolder(f.id, f.name);
  tbody.appendChild(tr);
});

  files.forEach(f => {
    const tr = document.createElement('tr');
    tr.className = 'row-file';
    tr.innerHTML = `
      <td><span class="icon">${fileIcon(f.contentType)}</span>${escapeHtml(f.name)}</td>
      <td>${escapeHtml(f.contentType || 'file')}</td>
      <td>${fmtSize(f.size)}</td>
      <td>${fmtDate(f.createdAt)}</td>
      <td class="actions-cell">
        <a class="btn btn-sm" href="${f.downloadUrl}" download>⬇️</a>
        <button class="btn btn-sm btn-danger" data-act="delete-file" data-id="${f.id}">🗑</button>
      </td>`;
    tbody.appendChild(tr);
  });

  tbody.onclick = (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    const id = btn.dataset.id;
    if (act === 'rename-folder') openRenameFolder(id, btn.dataset.name);
    if (act === 'delete-folder') deleteFolder(id);
    if (act === 'delete-file') deleteFile(id);
  };
}

function openFolder(id, name) {
  state.currentFolderId = id;
  state.folderPath.push({ id, name });
  loadFolder();
}

// ===================== ACTIONS =====================
$('#new-folder-btn').onclick = () => openModal(`
  <h3>Новая папка</h3>
  <div class="field">
    <label>Имя</label>
    <input id="nf-name" autofocus />
  </div>
  <div class="err" id="nf-err"></div>
  <div class="modal-actions">
    <button class="btn" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" id="nf-ok">Создать</button>
  </div>
`, async () => {
  const name = $('#nf-name').value.trim();
  if (!name) return;

  try {
    debugLog('info', 'Creating folder', { name, parentID: state.currentFolderId });
    await api('/api/v1/folders', {
      method: 'POST',
      body: { name, parentID: state.currentFolderId }
    });
    closeModal();
    toast('Папка создана', 'success');
    loadFolder();
  } catch (e) {
    if (e.message.includes('already exists')) {
      $('#nf-err').textContent = 'Папка с таким именем уже существует';
    } else {
      toast(e.message, 'error');
    }
  }
});

$('#upload-btn').onclick = () => $('#file-input').click();
$('#file-input').onchange = async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;

  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);

    try {
      debugLog('info', 'Uploading file', { name: file.name, size: file.size, folderID: state.currentFolderId });
      await api('/api/v1/files?folderID=' + encodeURIComponent(state.currentFolderId), {
        method: 'POST', body: fd
      });
    } catch (err) {
      toast('Ошибка загрузки ' + file.name + ': ' + err.message, 'error');
      e.target.value = '';
      return;
    }
  }
  e.target.value = '';
  toast('Загружено: ' + files.length, 'success');
  loadFolder();
};

function openRenameFolder(id, oldName) {
  openModal(`
    <h3>Переименовать папку</h3>
    <div class="field">
      <label>Новое имя</label>
      <input id="rf-name" value="${escapeAttr(oldName)}" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="rf-ok">Сохранить</button>
    </div>
  `, async () => {
    const name = $('#rf-name').value.trim();
    if (!name) return;

    try {
      await api('/api/v1/folders/' + encodeURIComponent(id), {
        method: 'PATCH', body: { name }
      });
      closeModal();
      toast('Переименовано', 'success');
      loadFolder();
    } catch (e) {
      toast(e.message, 'error');
    }
  });
}

async function deleteFolder(id) {
  if (!confirm('Удалить папку и всё её содержимое?')) return;
  try {
    await api('/api/v1/folders/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('Папка удалена', 'success');
    loadFolder();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteFile(id) {
  if (!confirm('Удалить файл?')) return;
  try {
    await api('/api/v1/files/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('Файл удалён', 'success');
    loadFolder();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ===================== MODAL =====================
function openModal(html, onSubmit) {
  $('#modal-content').innerHTML = html;
  $('#modal-backdrop').classList.add('visible');
  const okBtn = $('#modal-content').querySelector('[id$="-ok"]');
  if (okBtn && onSubmit) okBtn.onclick = onSubmit;
}

function closeModal() {
  $('#modal-backdrop').classList.remove('visible');
}

$('#modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

// ===================== HELPERS =====================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function fmtSize(b) {
  if (!b && b !== 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0; let n = b;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + ' ' + units[i];
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fileIcon(ct) {
  if (!ct) return '📄';
  if (ct.startsWith('image/')) return '🖼️';
  if (ct.startsWith('video/')) return '🎬';
  if (ct.startsWith('audio/')) return '🎵';
  if (ct.includes('pdf')) return '📕';
  if (ct.includes('zip') || ct.includes('rar') || ct.includes('tar')) return '🗜️';
  if (ct.includes('text') || ct.includes('json') || ct.includes('xml')) return '📝';
  return '📄';
}

// ===================== INIT =====================
debugLog('info', 'App initialized', { hasToken: !!state.token, email: state.email });

if (state.token) {
  showApp();
} else {
  showAuth();
}
</script>
