services:
  backend:
    build: .
    container_name: banana-backend
    restart: unless-stopped
    environment:
      BANANA_ADDR: "0.0.0.0"
      BANANA_PORT: "8080"
      BANANA_DATA_DIR: "/data"
      BANANA_QUOTA_SIZE: "1073741824"
      BANANA_MAX_UPLOAD_SIZE: "104857600"
    volumes:
      - banana-data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ../banana-landing
    container_name: banana-landing
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_ORIGIN: "http://backend:8080"
    ports:
      - "80:80"
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090" # Порт для веб-интерфейса Prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000" # Порт для веб-интерфейса Grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль для входа (логин admin)

volumes:
  banana-data:
  prometheus-data:
  grafana-data:
