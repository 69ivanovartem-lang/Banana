services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      BANANA_QUOTA_SIZE: "1073741824"
      BANANA_MAX_UPLOAD_SIZE: "104857600"
    volumes:
      - banana-data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"

volumes:
  banana-data: